<style>
:root { --ink:#16181D; --ink2:#3C4149; --ink3:#5C636D; --rule:#B9BFC7; --wash:#E3E7EC; --read:#0B5D6B; }
* { box-sizing: border-box; }
body { margin: 0; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }
main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.kicker { font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }
h1 { font-size: 1.9rem; line-height: 1.15; margin: .3rem 0 1rem; }
.code { color: var(--read); }
audio { width: 100%; margin: .4rem 0 1rem; }
.card { border: 1px solid var(--rule); border-radius: .6rem; padding: 1rem; margin: 1rem 0; }
.muted { color: var(--ink3); }
a { color: var(--read); }
ul.tracks { list-style: none; padding: 0; }
ul.tracks li { border-bottom: 1px solid var(--wash); padding: .7rem 0; }
ul.tracks a { font-weight: 700; text-decoration: none; }
details summary { cursor: pointer; font-weight: 700; }
pre { white-space: pre-wrap; font: inherit; }
</style>
</head>
